<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | UGC community</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
        :root{
            --bg:#0b0b0f;
            --surface:#13131a;
            --surface2:#1a1a24;
            --surface3:#22222e;
            --border:#252535;
            --border-hover:#3a3a50;
            --text:#ececf0;
            --text2:#8a8a9a;
            --text3:#55556a;
            --accent:#7c5cfc;
            --accent2:#a78bfa;
            --accent-glow:rgba(124,92,252,.12);
            --danger:#ef4444;
            --danger-bg:rgba(239,68,68,.1);
            --success:#22c55e;
            --success-bg:rgba(34,197,94,.1);
            --radius:14px;
            --radius-sm:10px;
            --transition:180ms cubic-bezier(.23,1,.32,1);
        }
        html{scroll-behavior:smooth}
        body{
            font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
            background:var(--bg);
            color:var(--text);
            min-height:100vh;
            line-height:1.5;
            -webkit-font-smoothing:antialiased;
        }

        /* ── HEADER ── */
        .topbar{
            position:sticky;top:0;z-index:50;
            background:rgba(11,11,15,.85);
            backdrop-filter:blur(20px);
            border-bottom:1px solid var(--border);
        }
        .topbar-inner{
            max-width:720px;margin:0 auto;
            display:flex;align-items:center;justify-content:space-between;
            padding:14px 20px;
        }
        .brand{
            font-family:'Space Grotesk',sans-serif;
            font-weight:700;font-size:1rem;
            letter-spacing:-.02em;
            background:linear-gradient(135deg,#7c5cfc,#c084fc);
            -webkit-background-clip:text;-webkit-text-fill-color:transparent;
        }
        .topbar-badge{
            font-size:.68rem;font-weight:700;
            color:#fff;
            background:var(--accent);
            padding:4px 12px;border-radius:20px;
            letter-spacing:.04em;
        }

        /* ── LOGIN ── */
        .login-wrap{
            max-width:400px;margin:100px auto;padding:0 20px;
        }
        .login-box{
            background:var(--surface);
            border:1px solid var(--border);
            border-radius:var(--radius);
            padding:36px 30px;
            text-align:center;
        }
        .login-box h2{
            font-family:'Space Grotesk',sans-serif;
            font-size:1.2rem;font-weight:700;
            margin-bottom:6px;
        }
        .login-box p{
            font-size:.82rem;color:var(--text2);margin-bottom:24px;
        }

        /* ── INPUT ── */
        .input{
            width:100%;padding:12px 16px;
            background:var(--surface2);
            border:1.5px solid var(--border);
            border-radius:var(--radius-sm);
            color:var(--text);
            font-family:inherit;font-size:.88rem;
            outline:none;
            transition:border-color var(--transition);
        }
        .input:focus{border-color:var(--accent)}
        .input::placeholder{color:var(--text3)}

        /* ── BUTTONS ── */
        .btn{
            display:inline-flex;align-items:center;justify-content:center;gap:6px;
            padding:11px 22px;
            border:none;border-radius:var(--radius-sm);
            font-family:inherit;font-size:.82rem;font-weight:600;
            cursor:pointer;
            transition:opacity var(--transition),transform 100ms ease;
            letter-spacing:.01em;
        }
        .btn:hover{opacity:.9}
        .btn:active{transform:scale(.97)}
        .btn-accent{background:var(--accent);color:#fff}
        .btn-ghost{background:var(--surface2);color:var(--text2);border:1.5px solid var(--border)}
        .btn-ghost:hover{border-color:var(--border-hover);color:var(--text)}
        .btn-danger{background:var(--danger-bg);color:var(--danger);border:1.5px solid rgba(239,68,68,.25)}
        .btn-sm{padding:8px 14px;font-size:.76rem}
        .btn-full{width:100%}

        /* ── PANEL ── */
        #panel{display:none}
        .panel{
            max-width:720px;margin:0 auto;
            padding:24px 20px 80px;
        }

        .toolbar{
            display:flex;gap:8px;margin-bottom:28px;
        }

        .label{
            font-size:.7rem;font-weight:600;
            text-transform:uppercase;letter-spacing:.08em;
            color:var(--text3);
            margin:28px 0 12px;
        }
        .label:first-child{margin-top:0}

        .card{
            background:var(--surface);
            border:1px solid var(--border);
            border-radius:var(--radius);
            padding:24px;
            margin-bottom:16px;
        }

        /* ── FORM ── */
        .form-group{margin-bottom:16px}
        .form-group label{
            display:block;
            font-size:.76rem;font-weight:500;
            color:var(--text2);
            margin-bottom:6px;
        }

        /* ── OPTION ROW ── */
        .opt-row{
            display:flex;align-items:center;gap:10px;
            padding:10px 12px;
            background:var(--surface2);
            border:1px solid var(--border);
            border-radius:var(--radius-sm);
            margin-bottom:8px;
        }
        .opt-num{
            font-size:.7rem;font-weight:700;
            color:var(--text3);
            width:22px;text-align:center;
            flex-shrink:0;
        }
        .opt-name-input{
            flex:1;min-width:0;
            padding:9px 12px;
            background:var(--surface);
            border:1.5px solid var(--border);
            border-radius:8px;
            color:var(--text);
            font-family:inherit;font-size:.84rem;
            outline:none;
            transition:border-color var(--transition);
        }
        .opt-name-input:focus{border-color:var(--accent)}
        .opt-name-input::placeholder{color:var(--text3)}

        .opt-img-wrap{
            position:relative;
            width:40px;height:40px;
            border-radius:8px;
            border:1.5px dashed var(--border);
            background:var(--surface);
            cursor:pointer;
            display:flex;align-items:center;justify-content:center;
            flex-shrink:0;
            overflow:hidden;
            transition:border-color var(--transition);
        }
        .opt-img-wrap:hover{border-color:var(--accent)}
        .opt-img-wrap img{
            width:100%;height:100%;
            object-fit:cover;
        }
        .opt-img-wrap .placeholder{
            color:var(--text3);font-size:.85rem;
        }

        .opt-rm{
            width:30px;height:30px;
            border-radius:50%;
            border:none;
            background:var(--danger-bg);
            color:var(--danger);
            cursor:pointer;
            font-size:.85rem;
            display:flex;align-items:center;justify-content:center;
            flex-shrink:0;
            transition:opacity var(--transition);
        }
        .opt-rm:hover{opacity:.8}

        .add-opt-btn{
            display:flex;align-items:center;gap:6px;
            width:100%;
            padding:10px 16px;
            background:transparent;
            border:1.5px dashed var(--border-hover);
            border-radius:var(--radius-sm);
            color:var(--success);
            font-family:inherit;font-size:.82rem;font-weight:500;
            cursor:pointer;
            transition:border-color var(--transition);
            margin-top:2px;
        }
        .add-opt-btn:hover{border-color:var(--success)}
        .add-opt-btn:disabled{opacity:.35;cursor:default;border-color:var(--border)}

        .actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}

        /* ── POLL LIST ── */
        .poll-item{
            display:flex;align-items:center;gap:14px;
            padding:14px 16px;
            background:var(--surface2);
            border:1px solid var(--border);
            border-radius:var(--radius-sm);
            margin-bottom:8px;
        }
        .poll-item-info{flex:1;min-width:0}
        .poll-item-info h4{
            font-size:.88rem;font-weight:600;
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
        }
        .poll-item-info p{
            font-size:.72rem;color:var(--text2);margin-top:2px;
        }
        .poll-item-info .live-tag{color:var(--danger);font-weight:600}
        .poll-item-info .closed-tag{color:var(--text3)}
        .poll-item-actions{display:flex;gap:6px;flex-shrink:0}

        .empty-list{
            text-align:center;padding:20px;
            font-size:.82rem;color:var(--text3);
        }

        /* ── TOAST ── */
        #toast{
            position:fixed;bottom:24px;left:50%;
            transform:translateX(-50%) translateY(80px);
            padding:10px 22px;
            background:var(--surface2);
            border:1.5px solid var(--border);
            border-radius:var(--radius-sm);
            color:var(--text);
            font-family:inherit;font-size:.84rem;font-weight:500;
            z-index:200;
            transition:transform .3s cubic-bezier(.23,1,.32,1);
            pointer-events:none;
            backdrop-filter:blur(10px);
        }
        #toast.show{transform:translateX(-50%) translateY(0)}
        #toast.success{border-color:rgba(34,197,94,.4)}
        #toast.error{border-color:rgba(239,68,68,.4)}
    </style>
</head>
<body>

<div class="topbar">
    <div class="topbar-inner">
        <span class="brand">Admin | UGC community</span>
        <span class="topbar-badge">Painel</span>
    </div>
</div>

<!-- LOGIN -->
<div id="login-screen" class="login-wrap">
    <div class="login-box">
        <h2>Acesso restrito</h2>
        <p>Digite a senha para acessar o painel administrativo.</p>
        <div class="form-group">
            <input type="password" class="input" id="pass-input" placeholder="Senha" onkeydown="if(event.key==='Enter')login()">
        </div>
        <button class="btn btn-accent btn-full" onclick="login()">Entrar</button>
    </div>
</div>

<!-- PANEL -->
<div id="panel">
    <div class="panel">
        <div class="toolbar">
            <button class="btn btn-ghost btn-sm" onclick="openSite()">&#9670; Ver site p&uacute;blico</button>
            <button class="btn btn-ghost btn-sm" onclick="logout()">Sair</button>
        </div>

        <!-- Criar votação -->
        <div class="label">Criar nova enquete</div>
        <div class="card">
            <div class="form-group">
                <label>T&iacute;tulo da enquete</label>
                <input type="text" class="input" id="poll-title" placeholder="Ex: Qual skin voc&ecirc; prefere?">
            </div>

            <div class="form-group">
                <label>Op&ccedil;&otilde;es (m&iacute;nimo 2, m&aacute;ximo 10)</label>
                <div id="opts-container"></div>
                <button class="add-opt-btn" id="add-btn" onclick="addOpt()">
                    <span>+</span> Adicionar op&ccedil;&atilde;o
                </button>
            </div>

            <div class="actions">
                <button class="btn btn-accent" onclick="publish()">&#9654; Publicar enquete</button>
                <button class="btn btn-ghost" onclick="clearForm()">Limpar</button>
            </div>
        </div>

        <!-- Enquetes ativas -->
        <div class="label">Enquetes ativas</div>
        <div id="active-list"></div>

        <!-- Histórico -->
        <div class="label">Hist&oacute;rico</div>
        <div id="hist-list"></div>

        <div style="margin-top:28px">
            <button class="btn btn-danger btn-sm" onclick="wipeAll()">&#10005; Apagar tudo</button>
        </div>
    </div>
</div>

<div id="toast"></div>

<script>
(function(){
    "use strict";

    const ADMIN_PASS = "2020JC12";
    const DURATION = 24 * 3600000;
    const POLL_KEY = "ugc_polls";
    const VOTES_KEY = "ugc_votes";
    const VOTED_KEY = "ugc_voted";
    const HIST_KEY = "ugc_history";

    let optCount = 0;

    function load(k, fb){ try{ return JSON.parse(localStorage.getItem(k)) ?? fb; }catch{ return fb; } }
    function save(k, v){ localStorage.setItem(k, JSON.stringify(v)); }
    function esc(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

    function toast(msg, type){
        const t=document.getElementById("toast");
        t.textContent=msg;
        t.className="show "+(type||"");
        setTimeout(()=>t.className="",2800);
    }

    /* ── LOGIN ── */
    window.login=function(){
        const inp=document.getElementById("pass-input");
        if(inp.value===ADMIN_PASS){
            document.getElementById("login-screen").style.display="none";
            document.getElementById("panel").style.display="block";
            inp.value="";
            toast("Bem-vindo!", "success");
            refresh();
        } else {
            toast("Senha incorreta", "error");
            inp.value="";
        }
    };

    window.logout=function(){
        document.getElementById("panel").style.display="none";
        document.getElementById("login-screen").style.display="block";
    };

    window.openSite=function(){
        window.open("index.html","_blank");
    };

    /* ── OPTIONS ── */
    window.addOpt=function(){
        if(optCount>=10) return;
        optCount++;
        const id=optCount;
        const container=document.getElementById("opts-container");
        const row=document.createElement("div");
        row.className="opt-row";
        row.id="or-"+id;
        row.innerHTML=`
            <span class="opt-num">${optCount}</span>
            <input class="opt-name-input" id="on-${id}" placeholder="Nome da op&ccedil;&atilde;o">
            <label class="opt-img-wrap" for="of-${id}">
                <img id="oi-${id}" style="display:none" src="" alt="">
                <span class="placeholder" id="ol-${id}">&#128247;</span>
            </label>
            <input type="file" id="of-${id}" accept="image/*" style="display:none" onchange="pickImg(${id})">
            <button class="opt-rm" onclick="rmOpt(${id})">&times;</button>
        `;
        container.appendChild(row);
        updateAddBtn();
    };

    window.rmOpt=function(id){
        if(optCount<=2){ toast("M&iacute;nimo de 2 op&ccedil;&otilde;es","error"); return; }
        const row=document.getElementById("or-"+id);
        if(row) row.remove();
        optCount--;
        const rows=document.querySelectorAll(".opt-row");
        rows.forEach((r,i)=>{ r.querySelector(".opt-num").textContent=i+1; });
        updateAddBtn();
    };

    function updateAddBtn(){
        document.getElementById("add-btn").disabled=optCount>=10;
    }

    window.pickImg=function(id){
        const file=document.getElementById("of-"+id).files[0];
        if(!file) return;
        const reader=new FileReader();
        reader.onload=function(e){
            const img=document.getElementById("oi-"+id);
            const label=document.getElementById("ol-"+id);
            img.src=e.target.result;
            img.style.display="block";
            label.style.display="none";
        };
        reader.readAsDataURL(file);
    };

    window.clearForm=function(){
        document.getElementById("opts-container").innerHTML="";
        document.getElementById("poll-title").value="";
        optCount=0;
        addOpt(); addOpt();
        updateAddBtn();
    };

    /* ── PUBLISH ── */
    window.publish=function(){
        const title=document.getElementById("poll-title").value.trim();
        if(!title){ toast("Coloque um t\u00edtulo","error"); return; }

        const rows=document.querySelectorAll(".opt-row");
        if(rows.length<2){ toast("M\u00ednimo de 2 op\u00e7\u00f5es","error"); return; }

        const options=[];
        rows.forEach(row=>{
            const nameInput=row.querySelector(".opt-name-input");
            const img=row.querySelector(".opt-img-wrap img");
            const name=nameInput?nameInput.value.trim():"";
            if(name){
                options.push({
                    name,
                    image:(img&&img.style.display!=="none")?img.src:null
                });
            }
        });

        if(options.length<2){ toast("Preencha pelo menos 2 op\u00e7\u00f5es","error"); return; }
        if(options.length>10){ toast("M\u00e1ximo de 10 op\u00e7\u00f5es","error"); return; }

        const now=Date.now();
        const poll={
            id:now.toString(),
            title,
            options,
            votes:new Array(options.length).fill(0),
            createdAt:now,
            expiresAt:now+DURATION,
            active:true
        };

        const polls=load(POLL_KEY,[]);
        polls.unshift(poll);
        save(POLL_KEY,polls);

        const hist=load(HIST_KEY,[]);
        hist.unshift({
            id:poll.id,
            title:poll.title,
            options:poll.options,
            votes:poll.votes,
            createdAt:now
        });
        save(HIST_KEY,hist);

        clearForm();
        refresh();
        toast("Enquete publicada!","success");
    };

    window.endPoll=function(id){
        if(!confirm("Encerrar esta enquete?")) return;
        const polls=load(POLL_KEY,[]);
        const p=polls.find(x=>x.id===id);
        if(p){ p.active=false; save(POLL_KEY,polls); }
        refresh();
        toast("Enquete encerrada","success");
    };

    window.deletePoll=function(id){
        if(!confirm("Apagar esta enquete?")) return;
        let polls=load(POLL_KEY,[]);
        polls=polls.filter(x=>x.id!==id);
        save(POLL_KEY,polls);
        refresh();
        toast("Removida","success");
    };

    window.wipeAll=function(){
        if(!confirm("Apagar TODOS os dados? Esta a\u00e7\u00e3o n\u00e3o pode ser desfeita.")) return;
        if(!confirm("Tem certeza absoluta?")) return;
        localStorage.removeItem(POLL_KEY);
        localStorage.removeItem(VOTES_KEY);
        localStorage.removeItem(VOTED_KEY);
        localStorage.removeItem(HIST_KEY);
        refresh();
        toast("Tudo apagado","success");
    };

    /* ── REFRESH ── */
    function refresh(){
        const polls=load(POLL_KEY,[]);
        const votes=load(VOTES_KEY,{});
        const hist=load(HIST_KEY,[]);

        // Cleanup expiradas
        const now=Date.now();
        let dirty=false;
        polls.forEach(p=>{
            if(p.active && now>=p.expiresAt){ p.active=false; dirty=true; }
        });
        const keep=polls.filter(p=>now<p.expiresAt+DURATION);
        if(keep.length!==polls.length) dirty=true;
        if(dirty) save(POLL_KEY,keep);

        // Ativas
        const active=polls.filter(p=>p.active);
        const al=document.getElementById("active-list");
        if(active.length===0){
            al.innerHTML='<div class="empty-list">Nenhuma enquete ativa</div>';
        } else {
            al.innerHTML=active.map(p=>{
                const pv=votes[p.id]||[];
                const total=pv.reduce((a,b)=>a+b,0);
                const rem=Math.max(0,p.expiresAt-now);
                const h=Math.floor(rem/3600000),m=Math.floor(rem%3600000/60000);
                return `
                    <div class="poll-item">
                        <div class="poll-item-info">
                            <h4>${esc(p.title)}</h4>
                            <p><span class="live-tag">Ativa</span> &middot; ${total} votos &middot; ${h}h${m}m restantes &middot; ${p.options.length} op\u00e7\u00f5es</p>
                        </div>
                        <div class="poll-item-actions">
                            <button class="btn btn-ghost btn-sm" onclick="endPoll('${p.id}')">Encerrar</button>
                            <button class="btn btn-danger btn-sm" onclick="deletePoll('${p.id}')">&times;</button>
                        </div>
                    </div>
                `;
            }).join("");
        }

        // Histórico
        const finished=hist.filter(h=>{
            const p=polls.find(x=>x.id===h.id);
            return !p||!p.active;
        });
        const hl=document.getElementById("hist-list");
        if(finished.length===0){
            hl.innerHTML='<div class="empty-list">Nada no hist\u00f3rico</div>';
        } else {
            hl.innerHTML=finished.slice(0,10).map(h=>{
                const max=Math.max(...h.votes);
                const total=h.votes.reduce((a,b)=>a+b,0);
                const winner=h.options[h.votes.indexOf(max)].name;
                return `
                    <div class="poll-item">
                        <div class="poll-item-info">
                            <h4>${esc(h.title)}</h4>
                            <p class="closed-tag">Vencedor: <strong>${esc(winner)}</strong> &middot; ${total} votos</p>
                        </div>
                    </div>
                `;
            }).join("");
        }
    }

    /* ── AUTO-CLEANUP ── */
    setInterval(()=>{
        const now=Date.now(), polls=load(POLL_KEY,[]);
        let dirty=false;
        polls.forEach(p=>{ if(p.active && now>=p.expiresAt){ p.active=false; dirty=true; } });
        const keep=polls.filter(p=>now<p.expiresAt+DURATION);
        if(keep.length!==polls.length) dirty=true;
        if(dirty){ save(POLL_KEY,keep); if(document.getElementById("panel").style.display!=="none") refresh(); }
    },30000);

    /* ── INIT ── */
    addOpt(); addOpt();
    updateAddBtn();
})();
</script>

</body>
</html>
